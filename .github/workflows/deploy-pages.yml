name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build

      - name: Prepare Pages artifact
        run: |
          # .nojekyll 跳过 Jekyll（否则 _next 这类下划线目录会被忽略）
          touch out/.nojekyll
          # 仓库变量 CUSTOM_DOMAIN 有值时才写 CNAME：
          # 未配置自定义域名时保持 github.io 地址可用，配置后自动切到自定义域名
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "${{ vars.CUSTOM_DOMAIN }}" > out/CNAME
            echo "CNAME -> ${{ vars.CUSTOM_DOMAIN }}"
          else
            echo "CUSTOM_DOMAIN 未设置，使用默认 github.io 地址"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
